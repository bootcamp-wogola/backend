    [project]
    name = "hackatown-wongola"
    version = "0.1.0"
    description = ""
    authors = [
        {name = "23Edu4rd0",email = "eduardo.vchaves23@gmail.com"}
    ]
    requires-python = ">=3.10,<4.0"
    dependencies = [
        "fastapi[standard] (>=0.136.3,<0.137.0)",
        "psycopg[async] (>=3.3.4,<4.0.0)",
        "python-jose (>=3.5.0,<4.0.0)",
        "pwdlib[argon2] (>=0.3.0,<0.4.0)",
        "sqlalchemy (>=2.0.50,<3.0.0)",
        "alembic (>=1.18.4,<2.0.0)",
        "aiosqlite (>=0.22.1,<0.23.0)",
        "asyncpg (>=0.31.0,<0.32.0)",
        "groq (>=1.4.0,<2.0.0)",
        "pydantic (>=2.13.4,<3.0.0)",
    ]


    [build-system]
    requires = ["poetry-core>=2.0.0,<3.0.0"]
    build-backend = "poetry.core.masonry.api"

    [dependency-groups]
    dev = [
        "pytest (>=9.0.3,<10.0.0)",
        "pytest-asyncio (>=1.4.0,<2.0.0)",
        "taskipy (>=1.14.1,<2.0.0)",
        "ruff (>=0.15.17,<0.16.0)"
    ]

    [tool.poetry]
        package-mode = false

    [tool.taskipy.tasks]
    lint = 'ruff check .'
    format = 'ruff format .'
    pos_format = 'ruff check . --fix'
    run = 'fastapi dev src/main.py'
    pre_tests = 'task format .'
    tests = 'pytest -s -x --cov=src.main -vv'
    deploy = 'fastapi deploy'

    [tool.ruff]
    line-length = 79
    extend-exclude = ['alembic', 'tests/**']

    [tool.ruff.lint]
    preview = true
    select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

    [tool.ruff.format]
    preview = true
    quote-style = 'single'